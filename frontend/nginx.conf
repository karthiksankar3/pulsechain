server {
    listen $PORT;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass https://pulsechain-production-7896.up.railway.app;
        proxy_set_header Host pulsechain-production-7896.up.railway.app;
    }
}
